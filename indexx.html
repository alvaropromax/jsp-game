.pw{width:44px;height:44px;border-radius:10px;background:linear-gradient(160deg,rgba(30,42,74,.92),rgba(10,16,32,.92));border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}

function trafficSignalState(rx,ry){
 const offset=(Math.round(rx/100)*17+Math.round(ry/100)*29)%2520;
 const phase=(S.frame+offset)%2520;
 if(phase<1080)return{horizontal:'green',vertical:'red'};
 if(phase<1260)return{horizontal:'yellow',vertical:'red'};
 if(phase<2340)return{horizontal:'red',vertical:'green'};
 return{horizontal:'red',vertical:'yellow'};
}
function trafficRedForAxis(axis,rx,ry){return trafficSignalState(rx,ry)[axis]==='red';}
function trafficShouldStop(axis,rx,ry,distance){const color=trafficSignalState(rx,ry)[axis];return color==='red'||color==='yellow'&&distance>100;}
function signalStopTarget(v){
 if(!v.ai||v.training||v.serviceVehicle||v.type==='heli'||v.type==='tank')return null;
 if(v.axis==='h'){
  let best=null,bd=120;
  for(const rx of VROADS){const d=(rx-v.x)*v.dir;if(d>=75&&d<bd&&v.lastInt!==rx&&trafficShouldStop('horizontal',rx,v.roadY,d)){best={axis:'h',road:rx,stop:rx-v.dir*75};bd=d;}}
  return best;
 }
 let best=null,bd=120;
 for(const ry of HROADS){const d=(ry-v.y)*v.dir;if(d>=75&&d<bd&&v.lastInt!==ry&&trafficShouldStop('vertical',v.roadX,ry,d)){best={axis:'v',road:ry,stop:ry-v.dir*75};bd=d;}}
 return best;
}
function checkRedLightCrossing(v,fromX,fromY,toX,toY){
 if(v!==player.vehicle||player.passenger||S.trafficJailUntil>absNow())return false;
 if(Math.abs(Math.cos(v.ang))>=Math.abs(Math.sin(v.ang))){
  for(const rx of VROADS)for(const ry of HROADS){
   if(Math.abs(fromY-ry)>RW/2||Math.abs(toY-ry)>RW/2)continue;
   if((fromX-rx)*(toX-rx)<=0&&fromX!==toX&&trafficRedForAxis('horizontal',rx,ry)){
    arrestPlayerForRedLight(v,rx,ry);return true;
   }
  }
 }else{
  for(const rx of VROADS)for(const ry of HROADS){
   if(Math.abs(fromX-rx)>RW/2||Math.abs(toX-rx)>RW/2)continue;
   if((fromY-ry)*(toY-ry)<=0&&fromY!==toY&&trafficRedForAxis('vertical',rx,ry)){
    arrestPlayerForRedLight(v,rx,ry);return true;
   }
  }
 }
 return false;
}
function arrestPlayerForRedLight(v,rx,ry){
 if(S.trafficJailUntil>absNow())return;
 player.money-=250;S.crime++;S.flags.redLightTickets=(S.flags.redLightTickets||0)+1;
 v.driver=null;v.ai=false;v.parked=true;v.speed=0;player.vehicle=null;player.passenger=false;
 S.trafficJailUntil=absNow()+30;S.inside=JAIL;S.outPos={x:JAIL.door.x,y:JAIL.door.y+30};

 player.kb.x=player.kb.y=0;player.moving=false;player.sitting=null;releasePower();

}

function interiorSpot(I){for(let i=0;i<40;i++){const x=rnd(30,I.w-30),y=rnd(30,I.h-40);if(!solidIn(I,x,y,13))return{x,y};}return{x:I.w/2,y:I.h-60};}
/* ---------- Colisão ---------- */
function solidIn(I,x,y,r){if(x-r<10||x+r>I.w-10||y-r<10)return true;if(y+r>I.h-10&&Math.abs(x-I.w/2)>28)return true;for(const f of I.furn)if(f.solid&&x+r>f.x&&x-r<f.x+f.w&&y+r>f.y&&y-r<f.y+f.h)return true;return false;}
function solidOut(x,y,r){if(x-r<0||x+r>W||y-r<0||y+r>H)return true;for(const b of buildings)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true;for(const s of SHACKS)if(x+r>s.x&&x-r<s.x+s.w&&y+r>s.y&&y-r<s.y+s.h)return true;return false;}
function pushOut(e){const b=inBuilding(e.x,e.y);if(b){e.x=b.door.x;e.y=b.door.y+30;}}

/* ===================== ANTI-TRAVAMENTO, MINIJOGOS E ESTÁDIO ===================== */
/* Procura o ponto livre mais próximo (usado para jogador e NPCs presos) */
function findFree(chk,x,y,maxR){
 if(!chk(x,y))return{x,y};
 for(let d=6;d<=maxR;d+=6){for(let k=0;k<16;k++){const a=k/16*Math.PI*2,nx=x+Math.cos(a)*d,ny=y+Math.sin(a)*d;if(!chk(nx,ny))return{x:nx,y:ny};}}
 return null;
}
/* Reposiciona o jogador num lugar livre (dentro ou fora de prédios) */
function unstickPlayer(){
 const I=S.inside?S.inside.interior:null;
 const chk=I?((x,y)=>solidIn(I,x,y,player.r)):((x,y)=>solidOut(x,y,player.r));
 const f=findFree(chk,player.x,player.y,260);
 if(f){player.x=f.x;player.y=f.y;}
 else if(I){player.x=I.w/2;player.y=I.h-40;}
 else{player.x=HOME.door.x;player.y=HOME.door.y+40;}
 player.kb.x=player.kb.y=0;
}
/* Detector: se o jogador pressiona uma direção e não sai do lugar por ~2,5s, é reposicionado */
let _stkT=0,_stkX=0,_stkY=0;
function stuckWatch(){
 const want=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||Math.hypot(joy.x,joy.y)>0.2;
 if(!want||player.vehicle||player.sitting||S.dialogOpen||(S.mini&&S.mini.lock)||player.intang||player.fly){_stkT=0;_stkX=player.x;_stkY=player.y;return;}
 if(Math.hypot(player.x-_stkX,player.y-_stkY)<0.3)_stkT++;else _stkT=0;
 _stkX=player.x;_stkY=player.y;
 if(_stkT>150){_stkT=0;unstickPlayer();notify('Você estava preso e foi reposicionado em um lugar livre.','warn');}
}
/* Levantar de sofá/carteira/banco/trono: procura posição livre ao redor */
function standUp(){
 const seat=player.sitting;
 player.sitting=null;
 const I=S.inside?S.inside.interior:null;
 const chk=I?((x,y)=>solidIn(I,x,y,player.r)):((x,y)=>solidOut(x,y,player.r));
 if(seat&&seat.kind==='desk'&&(S.inside===SCHOOL||S.inside===SCHOOL2||S.inside===OLINDINA)&&I){
  const desks=I.furn.filter(f=>f.kind==='desk');
  if(desks.length){
   const aisleY=Math.max(...desks.map(f=>f.y+f.h))+17;
   const aisle=findFree(chk,player.x,aisleY,60);
   if(aisle){player.x=aisle.x;player.y=aisle.y;player.kb.x=player.kb.y=0;player.avoidDeskInteract=true;return;}
  }
 }
 for(const [dx,dy] of [[0,-30],[0,30],[30,0],[-30,0],[0,-55],[0,55],[55,0],[-55,0]]){const x=player.x+dx,y=player.y+dy;if(!chk(x,y)){player.x=x;player.y=y;return;}}
 const f=findFree(chk,player.x,player.y,200);if(f){player.x=f.x;player.y=f.y;}
}
/* Ao criar cada interior: libera o corredor da porta (móveis sólidos colados na entrada viram passáveis) */
function validateInterior(b){
 const I=b.interior;if(!I)return;
 const sx=I.w/2,sy=I.h-30;
 for(const f of I.furn){if(!f.solid||f.kind==='wall')continue;
  const cx=clamp(sx,f.x,f.x+f.w),cy=clamp(sy,f.y,f.y+f.h);
  if(Math.hypot(sx-cx,sy-cy)<26)f.solid=false;}
}

const dlg={el:$('dialog'),name:$('dname'),text:$('dtext'),opts:$('dopts'),port:$('portrait'),list:[]};const dialogQueue=[];
function dialog(name,text,opts,look){if(S.dialogOpen){dialogQueue.push([name,text,opts,look]);return;}S.dialogOpen=true;S.holding=false;dlg.el.style.display='block';dlg.name.textContent=name;dlg.text.textContent=text;dlg.opts.innerHTML='';drawPortrait(look||null,name);const list=(opts&&opts.length)?opts:[{t:'Fechar'}];list.forEach((o,i)=>{const d=document.createElement('div');d.className='opt';d.textContent=(i+1)+'. '+o.t;d.onclick=()=>{closeDialog();if(o.cb)o.cb();};dlg.opts.appendChild(d);});dlg.list=list;}
function closeDialog(){S.dialogOpen=false;dlg.el.style.display='none';if(dialogQueue.length){const q=dialogQueue.shift();setTimeout(()=>dialog(...q),80);}}
function chooseOpt(i){if(!S.dialogOpen||!dlg.list[i])return;const o=dlg.list[i];closeDialog();if(o.cb)o.cb();}
function drawPortrait(look,name){const c=dlg.port.getContext('2d');c.clearRect(0,0,64,64);const g=c.createLinearGradient(0,0,0,64);g.addColorStop(0,'#2c3e70');g.addColorStop(1,'#101a30');c.fillStyle=g;c.fillRect(0,0,64,64);const L=look||{skin:'#c68642',shirt:'#457b9d',hair:'#111'};c.fillStyle=L.shirt;c.beginPath();c.arc(32,76,26,0,7);c.fill();c.fillStyle=L.skin;c.beginPath();c.arc(32,30,15,0,7);c.fill();if(L.hair!=='bald'){c.fillStyle=L.hair;c.beginPath();c.arc(32,26,15,Math.PI,0);c.fill();if(L.long){c.fillRect(17,26,5,22);c.fillRect(42,26,5,22);}}if(L.cap){c.fillStyle=L.cap;c.fillRect(16,12,32,7);}c.fillStyle=L.vamp?'#e00':'#111';c.fillRect(25,30,4,4);c.fillRect(35,30,4,4);c.fillStyle='#000';c.fillRect(27,39,10,2);}
/* Fila de avisos: no máximo 3 na tela, texto repetido não acumula, e avisos
   comuns aguardam a vaga para não poluir a tela do jogador. */
const notifQueue=[];
function notify(text,cls='',prio=1){
 if(!text)return;const box=$('notifs');
 const dup=[...box.children].find(c=>c.dataset.txt===text&&c.dataset.cls===cls);
 if(dup){clearTimeout(dup._t);dup._t=setTimeout(()=>closeNotif(dup),4800);const qi=notifQueue.findIndex(q=>q.text===text);if(qi>=0)notifQueue.splice(qi,1);return;}
 if(cls==='warn'||cls==='gold'||prio>=2){pushNotif(text,cls);}
 else if(notifQueue.length<3&&!notifQueue.some(q=>q.text===text))notifQueue.push({text,cls});
}
function pushNotif(text,cls){
 const box=$('notifs');
 while(box.children.length>=3)box.lastChild.remove();
 const n=document.createElement('div');n.className='notif '+cls;n.textContent=text;n.title=text;n.dataset.txt=text;n.dataset.cls=cls;box.prepend(n);
 n._t=setTimeout(()=>closeNotif(n),4800);
}
function closeNotif(n){if(!n)return;clearTimeout(n._t);n.style.opacity='0';n.style.transition='opacity .4s';setTimeout(()=>n.remove(),450);}
function flushNotif(){const box=$('notifs');if(box.children.length<2){const q=notifQueue.shift();if(q)pushNotif(q.text,q.cls);}}
function msg(text,t=240){S.msg=text;S.msgT=t;}
/* Transição de tela: escurece, mostra um título opcional e troca de cena no meio */
function fade(cb,text){const f=$('fade');f.textContent=text||'';f.style.opacity='1';setTimeout(()=>{if(cb)cb();f.style.opacity='0';setTimeout(()=>{f.textContent='';},650);},650);}

 const d=parseInt(e.key);if(d>=1&&d<=9)selectPower(d-1);if(e.code==='Digit0')selectPower(9);

});

/* ===================== JOGADOR ===================== */
function powersBlocked(){return !!S.swap||absNow()<S.noPowersUntil;}
function updatePlayer(dt){
 stuckWatch();// detector de travamento (reposiciona se o jogador ficar parado contra algo)
 if(player.kb.x||player.kb.y){player.x+=player.kb.x*dt;player.y+=player.kb.y*dt;player.kb.x*=0.85;player.kb.y*=0.85;if(Math.abs(player.kb.x)<0.05)player.kb.x=0;if(Math.abs(player.kb.y)<0.05)player.kb.y=0;ensureFree();}
 if(player.animT>0){player.animT-=dt;if(player.animT<=0)player.anim=null;}
 if(player.carry){const c=player.carry;if(c.dead||c.remove||(S.inside?c.insideB!==S.inside:c.insideB)){c.held=false;player.carry=null;}else{const hx=player.x,hy=player.y-30*player.scale;if(c.isVehicle){c.x=hx;c.y=hy;c.speed=0;}else if(c.insideB){c.ix=hx;c.iy=hy;}else{c.x=hx;c.y=hy;}c.stun=Math.max(c.stun||0,5);}}
 if(player.vehicle){const v=player.vehicle;if(!player.passenger&&!S.dialogOpen)driveVehicle(v,dt);if(player.vehicle){player.x=v.x;player.y=v.y;}player.moving=false;return;}
 let dx=0,dy=0;const locked=player.downed||S.dialogOpen||(S.mini&&S.mini.lock)||player.sitting||S.trafficJailUntil>absNow();
 if(!locked){if(keys.KeyW||keys.ArrowUp)dy-=1;if(keys.KeyS||keys.ArrowDown)dy+=1;if(keys.KeyA||keys.ArrowLeft)dx-=1;if(keys.KeyD||keys.ArrowRight)dx+=1;dx+=joy.x;dy+=joy.y;}
 const len=Math.hypot(dx,dy);
 if(len>0.15)player.avoidDeskInteract=false;
 if(len>0.15){dx/=len;dy/=len;player.ang=Math.atan2(dy,dx);player.moving=true;player.walk+=dt*0.25*(player.fast?3:1);}else{player.moving=false;dx=dy=0;}
 let sp=3.2*(player.fast?3.6:1)*(S.swap?0.8:1);if(player.scale>1.5)sp*=1.4;if(player.scale<0.7)sp*=0.75;if(player.fly)sp*=1.5;
 const ignore=player.intang||player.fly;
 const chk=S.inside?((x,y)=>solidIn(S.inside.interior,x,y,player.r*Math.min(player.scale,1))):((x,y)=>solidOut(x,y,player.r*Math.min(player.scale,1.2)));
 const nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
 if(ignore||!chk(nx,player.y))player.x=nx;if(ignore||!chk(player.x,ny))player.y=ny;
 if(S.inside){const I=S.inside.interior;player.x=clamp(player.x,12,I.w-12);player.y=clamp(player.y,12,I.h-2);if(player.y>I.h-8&&Math.abs(player.x-I.w/2)<30&&S.trafficJailUntil<=absNow())exitBuilding();}
  
  else{player.x=clamp(player.x,10,W-10);player.y=clamp(player.y,10,H-10);}
 // efeitos de poderes ativos
 if(player.fast&&player.moving&&S.frame%2===0)parts.push({x:player.x,y:player.y,vx:0,vy:0,life:14,max:14,size:12*player.scale,color:'rgba(80,160,255,0.35)',type:'trail'});
 if(player.fly&&S.frame%6===0)fx(player.x+rnd(-10,10),player.y+10,'wind',1,Math.PI/2);
 if(player.fast&&player.moving&&S.frame%40===0)witness(1);
 if(player.fly&&S.frame%60===0)witness(1.5);
 // Álvaro tem energia infinita: poderes não drenam vigor nem desligam sozinhos.
 player.energy=100;
 if(player.hp<=0&&!player.downed){
  player.hp=0;player.downed=true;
  fade(()=>{player.hp=player.hpMax;player.x=HOSP.door.x;player.y=HOSP.door.y+40;player.kb.x=player.kb.y=0;if(player.vehicle){if(player.vehicle.driver===player)player.vehicle.driver=null;player.vehicle.ai=false;player.vehicle.parked=true;player.vehicle.speed=0;}player.vehicle=null;player.passenger=false;S.inside=null;player.downed=false;notify('Você desmaiou e acordou no hospital com a vida recuperada.','warn');});
 }
}
function driveVehicle(v,dt){
 let acc=0,turn=0;if(keys.KeyW||keys.ArrowUp)acc=1;if(keys.KeyS||keys.ArrowDown)acc=-1;if(keys.KeyA||keys.ArrowLeft)turn=-1;if(keys.KeyD||keys.ArrowRight)turn=1;
 if(Math.hypot(joy.x,joy.y)>0.2){const a=Math.atan2(joy.y,joy.x);const d=angDiff(v.ang,a);turn=clamp(d*2,-1,1);acc=Math.abs(d)<2?1:-0.5;}
 v.speed+=acc*0.14*dt;v.speed*=0.985;v.speed=clamp(v.speed,-2.5,v.max*1.6);
 if(Math.abs(v.speed)>0.3)v.ang+=turn*0.05*dt*Math.sign(v.speed);
 const fromX=v.x,fromY=v.y,nx=v.x+Math.cos(v.ang)*v.speed*dt,ny=v.y+Math.sin(v.ang)*v.speed*dt;
 if(!solidOut(nx,ny,v.w*0.35)){v.x=nx;v.y=ny;if(checkRedLightCrossing(v,fromX,fromY,nx,ny))return;}else{if(Math.abs(v.speed)>2){fx(v.x,v.y,'hit');SFX.punch();cam.shake=6;}v.speed*=-0.3;}
 v.x=clamp(v.x,20,W-20);v.y=clamp(v.y,20,H-20);
 if(Math.abs(v.speed)>1&&S.frame%8===0)fx(v.x-Math.cos(v.ang)*v.w/2,v.y-Math.sin(v.ang)*v.w/2,'smoke',1);
 hitPedestrians(v);
}

function witness(amount){
 if(S.rebel)return;
 if(S.inside){for(const n of npcs)if(n.insideB===S.inside&&!n.dead)seen(n,amount*0.5);return;}
 if(player.invis)return;
 for(const n of npcs){if(n.dead||n.insideB||n.vehicle)continue;if(dist(n,player)<320)seen(n,amount);}
}
function seen(n,amount){
 if(n.hostile||n.role==='soldier'||n.role==='lex'||n.role==='lionel')return;
 S.fame=(S.fame||0)+amount*0.3;
 if(n.kind==='child'||n.look.child){n.bubble=pick(['😲 UAU!','🤩 Super-herói!','Faz de novo!']);n.bubbleT=120;n.rel++;if(n.role==='friend'||n.role==='family')rememberSecret(n);S.exposure+=amount*0.3;return;}
 if(n.role==='friend'||n.role==='family'){rememberSecret(n);return;}
 if(n.bully){n.bully=false;n.state='idle';n.scared=900;n.bubble='😱 Foi mal, chefe!';n.bubbleT=200;}
 if(n.rival){n.rival=false;n.state='idle';n.scared=900;n.bubble='😨 Nunca mais olho pra ela!';n.bubbleT=200;}
 S.exposure+=amount*(player.morph?0.3:1)*(n.insideB?0.5:1);n.scared=Math.max(n.scared,90);if(Math.random()<0.3){n.bubble=pick(['😲','😱','O que é isso?!']);n.bubbleT=90;}
}
function rememberSecret(n){if(!n.knows){n.knows=true;S.flags.knowers=(S.flags.knowers||0)+1;notify(n.name+' viu seus poderes! "Seu segredo está seguro comigo."','good');SFX.msg();}}
/* ---------- Agarrar / Tapa ---------- */
function grabOrThrow(){
 if(!S.started||S.dialogOpen||player.vehicle||powersBlocked())return;
 if(player.carry){const c=player.carry;player.carry=null;const a=aimAngle();SFX.wind();witness(4);
  if(c.isVehicle){c.thrown={vx:Math.cos(a)*10,vy:Math.sin(a)*10,z:20,vz:6};c.held=false;notify('Você arremessou o veículo!');}
  else{c.held=false;c.kb.x=Math.cos(a)*16;c.kb.y=Math.sin(a)*16;c.stun=120;c.bubble='AAAH!';c.bubbleT=100;setTimeout(()=>{if(!c.dead)damageNPC(c,45,'throw');},350);notify('Você jogou '+c.name+' longe!');if(!c.hostile&&(c.role==='friend'||c.role==='family'))c.rel-=3;}
  return;}
 const n=nearestNPC(player,50,m=>!m.dead&&!m.held&&m.role!=='lex'&&m.role!=='lionel'&&(S.inside?m.insideB===S.inside:!m.insideB&&!m.vehicle)&&!m.fb);
 if(n){player.carry=n;n.held=true;n.state='idle';n.cmd=null;n.kb.x=n.kb.y=0;n.bubble='😱 Me solta!';n.bubbleT=120;SFX.punch();witness(3);notify('Você agarrou '+n.name+'. Pressione G (ou AGARRAR) de novo para arremessar.');return;}
 if(!S.inside){const v=nearestVehicle(player,70);if(v&&!v.wreck&&!v.thrown&&v.type!=='tank'){if(v.driver)npcLeaveVehicle(v.driver);v.ai=false;v.parked=false;v.isVehicle=true;v.held=true;player.carry=v;SFX.punch();witness(5);notify('Você levantou um '+(v.type==='bus'?'ônibus':'veículo')+' acima da cabeça! G para arremessar.');return;}}
 notify('Nada perto para agarrar.');
}
function slap(){
 if(!S.started||S.dialogOpen||player.vehicle)return;
 const a=aimAngle();player.ang=a;player.anim='punch';player.animT=10;SFX.kick();
 const n=nearestNPC(player,50*player.scale,m=>!m.dead&&(S.inside?m.insideB===S.inside:!m.insideB&&!m.vehicle)&&!m.fb);
 if(!n){notify('Ninguém perto para dar um tapa.');return;}
 if(n.mmaFighter){damageNPC(n,999,'punch');return;}// nocaute técnico: tapa derruba o lutador
 if(n.immortal||n.boss){damageNPC(n,30,'punch');return;}
 n.stun=900;n.anim='lying';n.state='idle';n.cmd=null;if(n.hostile){n.hostile=false;n.scared=600;onVillainDefeated(n);}n.bubble='💤';n.bubbleT=300;fx(npcPos(n).x,npcPos(n).y-10,'hit',5);notify('Tapa! '+n.name+' dormiu por um bom tempo.');witness(2);
 setTimeout(()=>{if(n.anim==='lying'&&!n.patient)n.anim=null;},15000);
}

function update(dt){
 S.frame++;
 const tscale=S.mini&&S.mini.type==='sleep'?0:1;
 S.time+=dt/60*tscale;if(S.time>=1440){S.time-=1440;S.day++;onNewDay();}

 }
 for(const v of vehicles)updateVehicle(v,dt);
 for(let i=npcs.length-1;i>=0;i--){const n=npcs[i];if(n.held){if(n.bubbleT>0)n.bubbleT-=dt;continue;}updateNPC(n,dt);if(n.remove){if(player.carry===n)player.carry=null;npcs.splice(i,1);}}
 updateAnimals(dt);updateBeach(dt);updateBees(dt);updateButterflies(dt);electionTick();autoMatchTick(dt);
 if(S.raidT>0)S.raidT-=dt;
 updateGangConflict(dt);
 puddleTick(dt);
 updateProjs(dt);updateParts(dt);
 if(S.holding&&!S.dialogOpen)holdPower(dt);else S.laser=null;
  storyTick(dt);miniTick(dt);
  player.energy=100;
 S.exposure=Math.max(0,S.exposure-0.012*dt);S.wanted=clamp(Math.floor(S.exposure/8),0,5);
 if(S.exposure>=40&&!S.army)armyArrive();
 const tz=(player.longe?0.33:(IS_TOUCH?0.8:clamp(CW/1300,0.7,1)))*(S.inside?1.25:1);
 cam.z=lerp(cam.z,tz,0.08*dt);
 let tx=player.x,ty=player.y;
  if(S.inside){const I=S.inside.interior;tx=I.w*cam.z<CW?I.w/2:clamp(tx,CW/2/cam.z,I.w-CW/2/cam.z);ty=I.h*cam.z<CH?I.h/2:clamp(ty,CH/2/cam.z,I.h-CH/2/cam.z);}
  
  else{tx=clamp(tx,CW/2/cam.z,W-CW/2/cam.z);ty=clamp(ty,CH/2/cam.z,H-CH/2/cam.z);}
 cam.x=lerp(cam.x,tx,0.12*dt);cam.y=lerp(cam.y,ty,0.12*dt);if(cam.shake>0)cam.shake-=dt;
 if(S.msgT>0){S.msgT-=dt;if(S.msgT<=0)S.msg='';}
 if(S.frame%40===0)flushNotif();

function metroPointAt(s){
 const left=40,top=40,right=W-40,bottom=H-40,topLen=right-left,rightLen=bottom-top,perimeter=2*(topLen+rightLen);
 s=((s%perimeter)+perimeter)%perimeter;
 if(s<topLen)return{x:left+s,y:top};
 s-=topLen;if(s<rightLen)return{x:right,y:top+s};
 s-=rightLen;if(s<topLen)return{x:right-s,y:bottom};
 s-=topLen;return{x:left,y:bottom-s};
}
function metroDestination(){
 const left=40,top=40,right=W-40,bottom=H-40,topLen=right-left,rightLen=bottom-top,perimeter=2*(topLen+rightLen);
 const start=topLen+rightLen+topLen+(bottom-METRO_STATION.door.y);
 const destinationS=rnd(0,perimeter),delta=(destinationS-start+perimeter)%perimeter;
 const route=[{x:METRO_STATION.door.x,y:METRO_STATION.door.y},{x:left,y:METRO_STATION.door.y}];
 const corners=[topLen,topLen+rightLen,topLen+rightLen+topLen,perimeter];
 for(let lap=0;lap<2;lap++)for(const corner of corners){const mark=corner+lap*perimeter;if(mark>start&&mark<start+delta)route.push(metroPointAt(mark));}
 const destination=metroPointAt(destinationS);route.push(destination);
 return{destination,route};
}
function metroTick(dt){
 if(!METRO_STATION)return;
 let service=S.flags.metroService;
 if(S.time>=7*60&&(!service||service.day!==S.day)){
  service=S.flags.metroService={day:S.day,phase:'boarding',departureAt:S.day*1440+10*60,passengerIds:[]};
  if(dist(player,METRO_STATION.door)<1100)notify('🚇 A Estação Lago Jardim abriu o embarque. O próximo trem parte às 10h.','good');
 }
 if(service&&service.day===S.day&&service.phase==='boarding'&&absNow()>=service.departureAt){
  const passengers=npcs.filter(n=>n.role==='metroRider'&&n.insideB===METRO_STATION&&n.inReason==='metroBoarding'&&!n.dead&&!n.remove);
  const trip=metroDestination();
  service.passengerIds=[];
  for(const n of passengers){npcExit(n);n.hiddenTransit=true;n.metroTripDay=S.day;service.passengerIds.push(n.id);}
  service.phase='transit';service.destination=trip.destination;service.route=trip.route;service.segment=0;service.segmentProgress=0;
  service.totalDistance=trip.route.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p.x-trip.route[i].x,p.y-trip.route[i].y),0);
  service.x=trip.route[0].x;service.y=trip.route[0].y;service.angle=0;
  if(dist(player,METRO_STATION.door)<1300)notify('🚇 O metrô partiu com '+passengers.length+' passageiro(s), rumo a um ponto aleatório do mapa.','gold');
 }
 if(!service||service.phase!=='transit'||service.day!==S.day)return;
 let remaining=dt/60*90;
 while(remaining>0&&service.segment<service.route.length-1){
  const a=service.route[service.segment],b=service.route[service.segment+1],length=Math.hypot(b.x-a.x,b.y-a.y);
  const left=length-service.segmentProgress,step=Math.min(remaining,left);
  service.segmentProgress+=step;remaining-=step;
  const t=length?service.segmentProgress/length:1;
  service.x=a.x+(b.x-a.x)*t;service.y=a.y+(b.y-a.y)*t;service.angle=Math.atan2(b.y-a.y,b.x-a.x);
  if(service.segmentProgress>=length){service.segment++;service.segmentProgress=0;}
 }
 if(service.segment>=service.route.length-1){
  const riders=npcs.filter(n=>service.passengerIds.includes(n.id)&&n.hiddenTransit&&!n.dead&&!n.remove);
  riders.forEach((n,i)=>{
   n.hiddenTransit=false;
   let x=clamp(service.destination.x+rnd(-55,55),24,W-24),y=clamp(service.destination.y+rnd(-55,55),24,H-24);
   if(solidOut(x,y,n.r||12)){const free=findFree((px,py)=>solidOut(px,py,n.r||12),x,y,120);if(free){x=free.x;y=free.y;}}
   n.x=x;n.y=y;n.state='idle';n.target=null;n.metroDestination=null;
   if(i===0)n.bubble='🚇 Cheguei ao meu destino!';n.bubbleT=110;
  });
  service.phase='complete';service.arrivedAt=absNow();
 }
}

function attendanceTick(){
 const prev=S.day-1;if(prev<1)return;
 const wasWeekday=(prev%7!==0)&&(prev%7!==6);// domingo e sábado não contam
 // --- ESCOLA ---
 if(wasWeekday&&!S.flags.reprovado){
  if(S.flags['schwent'+prev]){S.absences=0;}
  else{
   S.absences=(S.absences||0)+1;
   player.stats.nota=Math.max(0,player.stats.nota-18);
   notify('🏫 Você FALTOU à aula ontem! Nota caiu para '+player.stats.nota+'/100 (faltas seguidas: '+S.absences+'/4).','warn');
   if(S.absences>=4||player.stats.nota<=0){
    S.flags.reprovado=true;S.absences=0;player.stats.nota=0;SFX.bad();
    notify('📕 VOCÊ REPROVOU na Escola Trajano por faltas e nota baixa! Vá falar com a Diretora para refazer o ano.','warn');
    dialog('Diretora Sônia','Álvaro, você matou aula demais. Nota zero e reprovação. Volte a assistir às aulas todos os dias (sente numa carteira) para recuperar o ano.',[{t:'Vou mudar isso, diretora.'}],{skin:'#c68642',shirt:'#6a1b9a',hair:'#ddd',long:true});
   }
  }
 }else if(S.flags['schwent'+prev]===undefined&&!wasWeekday){/* fim de semana: sem cobrança */}
 if(S.flags.reprovado&&S.flags['schwent'+prev]){
  S.recover=(S.recover||0)+1;
  if(S.recover>=3){S.flags.reprovado=false;S.recover=0;player.stats.nota=Math.max(player.stats.nota,50);SFX.goal();notify('🎓 Você recuperou o ano letivo! Continue indo às aulas.','gold');}
 }
 // --- EMPREGO ---
 if(S.job&&wasWeekday){
  if(S.flags['jobwent'+prev])S.jobMiss=0;
  else{
   S.jobMiss=(S.jobMiss||0)+1;
   if(S.jobMiss>=3){
    const nome=S.job.b.name,cargo=S.job.title;S.job=null;S.jobMiss=0;SFX.bad();
    notify('💼 VOCÊ FOI DEMITIDO de '+cargo+' em '+nome+' por faltar 3 dias seguidos!','warn');
    dialog(nome,'Álvaro, você não apareceu para trabalhar três dias seguidos. Está demitido. Se quiser voltar, peça emprego de novo outro dia.',[{t:'Entendi...'}]);
   }else notify('💼 Você faltou ao trabalho ontem! ('+S.jobMiss+'/3 — na terceira falta você é demitido)','warn');
  }
 }
 // limpeza das marcas antigas
 for(const k in S.flags)if((k.startsWith('schwent')||k.startsWith('jobwent'))&&parseInt(k.replace(/\D/g,''))<S.day-2)delete S.flags[k];
}

    else a.ang+=Math.PI/2;
   }
   a.z=0;continue;
  }
  // animal chamado por um NPC que comprou ração: vai até ele e come
  if(a.feedN){const f=a.feedN;a.feedT-=dt;
   if(f.dead||f.remove||f.insideB||a.feedT<=0||a.followP||a.attk||a.dance){a.feedN=null;}
   else{const d=dist(a,f);
    if(d>22){a.ang=Math.atan2(f.y-a.y,f.x-a.x);const nx=a.x+Math.cos(a.ang)*a.speed*1.6*dt,ny=a.y+Math.sin(a.ang)*a.speed*1.6*dt;if(!solidOut(nx,ny,6)){a.x=nx;a.y=ny;}else a.ang+=0.7;}

    continue;}}
  if(a.type==='bat'){if(!night){animals.splice(i,1);continue;}const v=npcs.find(n=>n.vamp&&!n.dead&&!n.insideB);const tx=v?v.x:PRACA.x+500,ty=v?v.y:PRACA.y+200;a.ang=Math.atan2(ty-a.y,tx-a.x)+Math.sin(S.frame*0.1+i)*1.2;a.x+=Math.cos(a.ang)*a.speed*dt;a.y+=Math.sin(a.ang)*a.speed*dt;a.z=30+Math.sin(S.frame*0.15+i)*8;continue;}
   // animais sob controle mental: seguem, dançam ou atacam
   if((a.followP||a.dance||a.attk)&&!S.inside){
    if(a.followP||a.dance){
     const d=dist(a,player),want=a.dance?70:38;

     else if(a.dance){a.ang+=0.14*dt;a.x=player.x+Math.cos(a.ang)*70;a.y=player.y+Math.sin(a.ang)*70;a.state='walk';a.t=80;}
     a.t=Math.max(a.t,30);continue;
    }
    if(a.attk){
     const h=hostiles.find(h=>!h.dead&&!h.insideB&&dist(h,a)<700);
     if(h){if(dist(a,h)>16){a.ang=Math.atan2(h.y-a.y,h.x-a.x);const nx=a.x+Math.cos(a.ang)*a.speed*2.6*dt,ny=a.y+Math.sin(a.ang)*a.speed*2.6*dt;if(!solidOut(nx,ny,6)){a.x=nx;a.y=ny;}}

function updateBeach(dt){

  if(!swimmers.length)return;

  if(dist(player,target)<950)notify('🦈 Um tubarão apareceu perto da praia!','warn');
  return;
 }

  shark.x+=Math.sign(target.x-shark.x)*2.5*dt;

 }

/* ---------- Movimento ---------- */
function moveDir(n,ang,sp,dt){
 n.ang=ang;n.moving=true;n.walk+=dt*0.25*(sp/1.5);
 const inside=!!n.insideB;const I=inside?n.insideB.interior:null;const px=inside?n.ix:n.x,py=inside?n.iy:n.y;
 const chk=inside?((x,y)=>solidIn(I,x,y,n.r)):((x,y)=>solidOut(x,y,n.r));
 let nx=px+Math.cos(ang)*sp*dt,ny=py+Math.sin(ang)*sp*dt,moved=false;
 if(!chk(nx,ny)){px2(n,nx,ny,inside);moved=true;}
 else if(!chk(nx,py)){px2(n,nx,py,inside);moved=true;}
 else if(!chk(px,ny)){px2(n,px,ny,inside);moved=true;}
 else{const a2=ang+n.nudge*Math.PI/2;const sx=px+Math.cos(a2)*sp*dt,sy=py+Math.sin(a2)*sp*dt;if(!chk(sx,sy)){px2(n,sx,sy,inside);moved=true;}else n.nudge*=-1;n.stuck+=dt;if(n.stuck>120){n.stuck=0;n.state='idle';n.t=30;n.target=null;}}
 return moved;
}
function px2(n,x,y,inside){if(inside){n.ix=x;n.iy=y;}else{n.x=x;n.y=y;}}
function moveTo(n,t,sp,dt){const px=n.insideB?n.ix:n.x,py=n.insideB?n.iy:n.y;return moveDir(n,Math.atan2(t.y-py,t.x-px),sp,dt);}
function moveWithin(n,t,area,dt,sp){
 moveTo(n,t,sp,dt);n.x=clamp(n.x,area.x+18,area.x+area.w-18);n.y=clamp(n.y,area.y+18,area.y+area.h-18);
}

function npcEnter(n,b,reason,t){n.insideB=b;n.inReason=reason||'visit';n.t=t||ri(400,1500);n.state='idle';n.target=null;n.moving=false;const I=b.interior;let p=null;
  if(b===UNIVERSITY&&n.role==='universityStudent'){const desks=I.furn.filter(f=>f.kind==='uniStudyDesk'||f.kind==='desk');const d=pick(desks);p=d?{x:d.x+18,y:d.y-12}:interiorSpot(I);n.anim='sit';}
  else if((b===SCHOOL||b===SCHOOL2||b===OLINDINA)&&(n.kind==='young'||n.kind==='child'||n.kind==='teen'||n.role==='student'||n.role==='olindinaStudent'||n.role==='olindinaNoiado'||n.role==='rich'||n.role==='friend')){const desks=I.furn.filter(f=>f.kind==='desk');const d=pick(desks);p={x:d.x+18,y:d.y-12};n.anim='sit';}
 else if(n.role==='doctor'){p={x:rnd(560,700),y:rnd(140,400)};}
 else p=interiorSpot(I);
 n.ix=p.x;n.iy=p.y;n.itarget=null;afterEnter(n,b,reason);}
function npcExit(n){const b=n.insideB;if(!b)return;if(b===RATION||b===PETSHOP)setTimeout(()=>feedNearbyAnimal(n),0);n.insideB=null;n.ix=null;n.iy=null;n.x=b.door.x+rnd(-12,12);n.y=b.door.y+28;n.state='idle';n.t=ri(30,120);n.anim=null;n.inReason=null;if(b===MARKET||b===SHOP)n.bag=true;else n.bag=false;}
function goInside(n,b,reason,dt){const d={x:b.door.x,y:b.door.y+18};if(dist(n,d)<26)npcEnter(n,b,reason);else moveTo(n,d,n.speed*1.1,dt);}
function isCommonResident(n){
 return !!n.home&&!n.hostile&&['civil','worker','student','universityStudent','olindinaStudent','olindinaNoiado','ridingStudent','barroResident','carShopper','bankCustomer','dentalPatient','tattooCustomer','arcadeGuest','metroRider','drivingStudent','localCrazy','friend','family','rich','shopper','delivery','waterCourier','foodCourier','electrician','mailcarrier','gamer','cool','drunk','velho','tech','pharma','zooguest','gymrat','cinemagoer','mmafan','runner','badBreath'].includes(n.role);
}
function eveningHomeAI(n,dt){
 if(!isCommonResident(n)||S.time/60<20)return false;

 if(n.storyProtected&&n.anim==='lying')n.anim=null;/* acordou do nocaute */

 switch(n.inReason){case 'school':out=h>=12||h<7;break;case 'universityClass':n.t-=dt;out=n.t<=0||h>=17;break;case 'work':out=h>=17||h<8;break;case 'bopeShift':out=h>=6&&h<22;break;case 'home':out=h>=6&&h<20;break;case 'luthorHome':out=h>=(n.dayStart==null?9:n.dayStart)&&h<(n.dayEnd==null?21:n.dayEnd)&&!(n.homeUntil&&absNow()<n.homeUntil);break;case 'visit':case 'gameStation':n.t-=dt;out=n.t<=0;break;default:out=false;}

 n.t-=dt;

/* ---------- IA principal ---------- */
// Desvia de veículos que vêm na sua direção (carros, motos, ônibus)
function dodgeVehicle(n){
 for(const v of vehicles){if(v===player.vehicle||v.wreck||v.thrown||v.type==='heli'||Math.abs(v.speed)<1.6)continue;
  const dx=n.x-v.x,dy=n.y-v.y,c=Math.cos(v.ang),s=Math.sin(v.ang);
  const f=dx*c+dy*s,lat=-dx*s+dy*c;
  if(f>-10&&f<v.speed*34+v.w/2+34&&Math.abs(lat)<40){
   const side=lat!==0?Math.sign(lat):(Math.random()<0.5?1:-1);
   moveDir(n,v.ang+side*Math.PI/2,n.speed*2.7,1);
   n.moving=true;n.bubble=pick(['😮','⚠️ CUIDADO!','Ufa...']);n.bubbleT=24;return true;}
 }
 return false;
}
// Porta de abrigo mais próxima (casa/comércio) para fugir de ameaças
function nearestShelter(n){
 let best=null,bd=650;
 for(const b of buildings){if(b.type==='lex'||b.type==='lionel')continue;const d=Math.hypot(b.door.x-n.x,b.door.y-n.y);if(d<bd){bd=d;best=b;}}
 return best;
}
// Ao ver crime, alguém chama a polícia
function reportCrime(){
 const c=npcs.find(n=>n.role==='police'&&!n.dead);if(!c)return;
 for(const n of npcs){if(n.dead||n.hostile||n.insideB||n.role!=='civil'||n.insideB)continue;if(dist(n,player)<460){n.bubble='☎ 190! Tem um sujeito armado aqui!';n.bubbleT=170;break;}}
 policePatrol();
}
function threatNear(n){let best=null,bd=220;if(n.invisShared)return null;for(const h of hostiles){if(h===n||h.hunter||h.sub==='lionelEmp')continue;if(n.storyProtected&&(h.tag==='lex'||h.tag==='reveal'||h.tag==='election'||h.tag==='lexrule'||h.sub==='lexClone'||h.sub==='lexArmor'||h.sub==='lexPowered'||h.sub==='alvaroEvil'))continue;/* capangas dos Luthor não assustam os Luthor */if(h.sub==='soldier'&&(!S.armyHostile||n.role==='police'))continue;const d=dist(h,n);if(d<bd){bd=d;best=h;}}if(!best&&S.rebel&&!player.invis&&!S.inside&&dist(n,player)<200)best=player;return best;}

 }

 if(n.dead){n.deadT-=dt;if(n.deadT<=0){if(n.sharkTaken){n.dead=false;n.sharkTaken=false;n.hp=n.hpMax;n.state='idle';n.x=n.beachSpot.x;n.y=n.beachSpot.y;n.bubble='😮 Ufa!';n.bubbleT=130;if(dist(player,n)<900)notify('🛟 Os salva-vidas resgataram '+n.name+' do tubarão!','good');return;}if(n.infectionExpired){n.remove=true;return;}if(n.killedByPlayer){n.remove=true;if(n.important)notify('💀 '+n.name+' morreu pelas suas mãos. Não há volta.','warn');return;}if(n.important||n.role==='police'||n.role==='doctor'||n.role==='vendor'||n.role==='runner'||n.role==='athlete'||n.role==='dancer'||n.role==='staff'){n.dead=false;n.hp=n.hpMax;n.state='idle';n.hostile=false;n.possessed=false;if(!n.insideB){n.x=HOSP.door.x+rnd(-30,30);n.y=HOSP.door.y+30;}if(n.important)notify(n.name+' saiu do hospital.');}else{n.remove=true;if(!n.hostile&&Math.random()<0.8)birth();}}return;}

 if(n.kb.x||n.kb.y){n.x+=n.kb.x*dt;n.y+=n.kb.y*dt;n.kb.x*=0.88;n.kb.y*=0.88;if(Math.abs(n.kb.x)<0.05)n.kb.x=0;if(Math.abs(n.kb.y)<0.05)n.kb.y=0;if(!n.insideB&&inBuilding(n.x,n.y)){n.kb.x=n.kb.y=0;pushOut(n);}n.x=clamp(n.x,10,W-10);n.y=clamp(n.y,10,H-10);}
 if(n.hp<n.hpMax&&S.frame%30===0)n.hp=Math.min(n.hpMax,n.hp+(n.immortal?10:1));
 if(n.vehicle){n.x=n.vehicle.x;n.y=n.vehicle.y;if(n.role==='delivery'&&S.time/60>=20&&n.home)npcLeaveVehicle(n);else if(n.role==='delivery'){if(Math.random()<0.003){n.bubble='🍔 Entrega!';n.bubbleT=100;}return;}else{n.t-=dt;if(n.t<=0){if(Math.abs(n.vehicle.speed)<0.4)npcLeaveVehicle(n);else n.vehicle.wantStop=true;}return;}}
 if(n.insideB&&n.ix!=null&&solidIn(n.insideB.interior,n.ix,n.iy,n.r||12)){const f=findFree((x,y)=>solidIn(n.insideB.interior,x,y,n.r||12),n.ix,n.iy,160);if(f){n.ix=f.x;n.iy=f.y;}}/* NPC preso dentro de um móvel é solto */

 if(!n.insideB&&!n.vehicle&&solidOut(n.x,n.y,n.r||12)){const f=findFree((x,y)=>solidOut(x,y,n.r||12),n.x,n.y,200);if(f){n.x=f.x;n.y=f.y;}}

 if(n.scared>0&&n.role!=='police'){if(!S.inside&&dist(n,player)<280){moveDir(n,Math.atan2(n.y-player.y,n.x-player.x),n.speed*2,dt);return;}}

   }
   n.anim=null;break;

function freeAI(n,dt){
 n.t-=dt;
 if(n.state==='walk'){
  if(!n.target||n.t<=0){n.state='idle';n.t=ri(60,240);return;}
  const d=dist(n,n.target);
  if(n.target.b&&d<26){npcEnter(n,n.target.b,'visit',ri(400,1400));return;}
  if(n.target.v&&d<34){if(!n.target.v.driver&&!n.target.v.wreck&&n.target.v!==player.vehicle)npcEnterVehicle(n,n.target.v);n.state='idle';n.t=60;return;}
  if(d<12){n.state='idle';n.t=ri(60,240);return;}
  moveTo(n,n.target,n.speed,dt);return;
 }
 if(n.state==='talk'){if(n.t<=0){n.state='idle';n.t=60;}return;}
 if(n.state==='fight'){fightAI(n,dt);return;}
 if(n.state==='bully'){n.t-=dt;
  const target=n.rival?S.gf:player;
  if(!target||S.inside||(target===S.gf&&(target.insideB||target.dead))||n.t<=0){n.state='idle';n.t=600;return;}
  if(dist(n,target)>30)moveTo(n,target,n.speed*1.3,dt);
  else if(n.cool<=0){
   n.cool=60;
   if(n.rival){n.bubble=pick(['😍 Oi, gata!','Larga esse cara!','Vem comigo!']);n.bubbleT=80;if(dist(n,player)<90){n.rival=false;n.scared=800;n.bubble='😨 Desculpa, ela é sua!';n.bubbleT=200;n.state='idle';}}
   else{n.bubble=pick(['Tá olhando o quê?','Vem pra briga!','Acha que é o quê?']);n.bubbleT=80;playerHurt(3,n);fx(player.x,player.y-8,'hit',3);SFX.punch();}
  }
  return;
 }
 if(n.partner&&!n.partner.dead&&!n.partner.insideB&&dist(n,n.partner)>60&&Math.random()<0.3){moveTo(n,n.partner,n.speed,dt);return;}
 if(n.bully&&!S.inside&&!player.invis&&dist(n,player)<160&&n.cool<=0&&!n.scared){n.state='bully';n.t=500;n.bubble='😠 Ei, você!';n.bubbleT=100;return;}
 if(n.rival&&S.gf&&!S.gf.insideB&&dist(n,S.gf)<400&&n.cool<=0&&!n.scared){n.state='bully';n.t=500;return;}
 if(n.t>0)return;
 if(npcBrain(n,dt))return;// decide pela necessidade mais urgente antes do passeio aleatório
 const r=Math.random();
 if(isSaturday()&&r<0.4){n.target={x:rnd(PRACA.x+60,PRACA.x+PRACA.w-60),y:rnd(PRACA.y+560,PRACA.y+PRACA.h-40)};n.state='walk';n.t=1300;return;}
 if(r<0.33){n.target=randomSpot();n.state='walk';n.t=900;return;}
 if(r<0.48){n.target={x:rnd(PRACA.x+40,PRACA.x+PRACA.w-40),y:rnd(PRACA.y+40,PRACA.y+PRACA.h-40)};n.state='walk';n.t=1300;return;}
 if(r<0.6){const b=pick([MARKET,SHOP,LANCH,SORVE,CHURCH,SORVE,MARKET,ASSAI,SHOPPING,MC,X1,GAS,ASSAI,SHOPPING,RATION,PETSHOP,LUXO,DEALERSHIP]);n.target={x:b.door.x,y:b.door.y+18,b};n.state='walk';n.t=1600;return;}
 if(r<0.68){const v=freeVehicleNear(n,260);if(v){n.target={x:v.x,y:v.y,v};n.state='walk';n.t=600;}else n.t=100;return;}
 if(r<0.8){
  const o=nearestNPC(n,110,m=>!m.hostile&&!m.insideB&&!m.vehicle&&m.state==='idle'&&!m.fb&&m.role!=='lex'&&m.role!=='lionel');
  if(!o){n.t=100;return;}
  n.state='talk';n.t=ri(150,400);o.state='talk';o.t=n.t;n.ang=Math.atan2(o.y-n.y,o.x-n.x);o.ang=n.ang+Math.PI;n.bubble=pick(TALK);n.bubbleT=140;o.bubble='...';o.bubbleT=140;
  if(Math.random()<0.07){startFight(n,o);return;}
  if(!n.partner&&!o.partner&&!n.important&&!o.important&&n.female!==o.female&&Math.random()<0.12){n.partner=o;o.partner=n;n.bubble='❤️';o.bubble='❤️';n.bubbleT=o.bubbleT=200;if(dist(n,player)<500)notify(n.name+' e '+o.name+' começaram a namorar!');return;}
  if(n.partner===o&&!n.married&&Math.random()<0.08){n.married=o.married=true;n.bubble='💍 Casamos!';o.bubble='💍';n.bubbleT=o.bubbleT=260;notify('💒 '+n.name+' e '+o.name+' se casaram na Igreja de Jardim São Paulo!','gold');fx(n.x,n.y-20,'heal',12);}
  return;
 }
 if(r<0.85&&n.home){n.target={x:n.home.door.x,y:n.home.door.y+18,b:n.home};n.state='walk';n.t=1600;return;}
 n.t=ri(100,300);
}

// Função para NPCs fazerem as pazes
function makePeace(a,b){
 if(a.state==='fight'&&a.foe===b)a.state='idle';
 if(b.state==='fight'&&b.foe===a)b.state='idle';
 a.foe=null;b.foe=null;a.t=ri(60,120);b.t=ri(60,120);

/* Gênero: usa o campo explícito; se não existir, deduz pela aparência (cabelo comprido) */
function isFem(n){return n.female!=null?!!n.female:!!(n.look&&n.look.long);}

function addFriend(a,b,loud){
 a.friends=a.friends||new Set();b.friends=b.friends||new Set();
 if(a.friends.has(b.id))return;
 a.friends.add(b.id);b.friends.add(a.id);a.rel+=2;b.rel+=2;
 setNPCEmotion(a,'happy',300);setNPCEmotion(b,'happy',300);
 if(loud&&!S.inside&&dist(a,player)<450)notify('🤝 '+a.name+' e '+b.name+' viraram amigos!','good');
}
const areFriends=(a,b)=>!!(a.friends&&a.friends.has(b.id));

function moodTick(n){
 if(n.hostile||n.role==='lex'||n.role==='lionel')return;
 if(n.state==='fight'){setNPCEmotion(n,'angry',300);return;}
 if(n.scared>0||n.hp<n.hpMax*0.5){setNPCEmotion(n,'sad',300);return;}
 if(n.partner&&!n.partner.dead&&!n.partner.insideB&&dist(n,n.partner)<80){setNPCEmotion(n,'love',300);return;}
 if(n.state==='talk'){
  const o=nearestNPC(n,70,m=>m!==n&&m.state==='talk'&&!m.insideB);
  if(o&&!areFriends(n,o)&&Math.random()<0.25)addFriend(n,o,true);else setNPCEmotion(n,'happy',240);
  return;
 }
 // reconciliação: algum tempo depois da briga, os dois se encontram e fazem as pazes
 const f=n.lastFoe;
 if(f&&S.frame>n.peaceAt&&!f.dead&&!f.remove&&!f.insideB&&f.state!=='fight'&&dist(n,f)<260){n.lastFoe=null;f.lastFoe=null;makePeace(n,f);if(!S.inside&&dist(n,player)<450)notify('🕊️ '+n.name+' e '+f.name+' fizeram as pazes.');}

function npcLeaveVehicle(n){const v=n.vehicle;if(!v)return;v.driver=null;v.trainingStudent=null;v.ai=false;v.parked=true;v.speed=0;v.wantStop=false;if(!v.training){if(v.axis==='h'&&v.roadY!=null)v.y=v.roadY+v.dir*48;else if(v.roadX!=null)v.x=v.roadX-v.dir*48;}n.vehicle=null;n.x=v.x+Math.cos(v.ang+Math.PI/2)*30;n.y=v.y+Math.sin(v.ang+Math.PI/2)*30;if(v.training){n.x=clamp(n.x,DRIVING_COURSE.x+16,DRIVING_COURSE.x+DRIVING_COURSE.w-16);n.y=clamp(n.y,DRIVING_COURSE.y+16,DRIVING_COURSE.y+DRIVING_COURSE.h-16);}if(inBuilding(n.x,n.y))pushOut(n);n.state='idle';n.t=100;}
function vehicleAhead(v){const cx=Math.cos(v.ang),cy=Math.sin(v.ang);for(const o of vehicles){if(o===v||o.type==='heli')continue;const dx=o.x-v.x,dy=o.y-v.y;const f=dx*cx+dy*cy,s=Math.abs(-dx*cy+dy*cx);if(f>0&&f<v.w/2+o.w/2+50&&s<(o.parked?16:26))return true;}
 for(const n of npcs){if(n.dead||n.insideB||n.vehicle)continue;const dx=n.x-v.x,dy=n.y-v.y;const f=dx*cx+dy*cy,s=Math.abs(-dx*cy+dy*cx);if(f>0&&f<v.w/2+60&&s<24)return true;}
 if(!S.inside&&!player.vehicle&&!player.fly){const dx=player.x-v.x,dy=player.y-v.y;const f=dx*cx+dy*cy,s=Math.abs(-dx*cy+dy*cx);if(f>0&&f<v.w/2+70&&s<26)return true;}return false;}
function hitPedestrians(v){if(v.serviceVehicle||Math.abs(v.speed)<1.2)return;const fx_=v.x+Math.cos(v.ang)*v.w/2,fy=v.y+Math.sin(v.ang)*v.w/2;for(const n of npcs){if(n.hiddenTransit||n.dead||n.insideB||n.vehicle||n.fb)continue;if(Math.hypot(n.x-fx_,n.y-fy)<18){damageNPC(n,20*Math.abs(v.speed)/2,'car');n.kb.x=Math.cos(v.ang)*6;n.kb.y=Math.sin(v.ang)*6;n.scared=300;n.bubble='😵';n.bubbleT=100;if(v===player.vehicle){notify('Você atropelou '+n.name+'!','warn');S.crime++;}if(!n.dead&&n.hp<50){n.target={x:HOSP.door.x,y:HOSP.door.y+18,b:HOSP};n.state='walk';n.t=2000;}}}
 if(v!==player.vehicle&&!S.inside&&!player.vehicle&&!player.fly&&!player.intang&&!player.invis&&Math.hypot(player.x-fx_,player.y-fy)<18+player.scale*6){
  if(Math.abs(v.speed)>=2&&player.scale<=1.6&&!v.armyExploded){
   // Batida em alta velocidade: o veículo atinge Álvaro e EXPLODE
   const spd=v.speed;v.armyExploded=true;v.speed=0;v.wreck=true;v.wreckT=900;v.hp=0;v.thrown=null;v.ai=false;
   if(v.driver){const d=v.driver;if(d!==player){npcLeaveVehicle(d);d.stun=220;d.anim='lying';d.bubble='😵';d.bubbleT=160;}}
   playerHurt(25,v);
   explodeAt(v.x,v.y,74);
   player.kb.x=Math.cos(v.ang)*Math.abs(spd)*3;player.kb.y=Math.sin(v.ang)*Math.abs(spd)*3;

   notify('💥 Um veículo bateu em você em alta velocidade e EXPLODIU!','warn');
   setTimeout(()=>{v.armyExploded=false;},4000);
  }else{player.kb.x=Math.cos(v.ang)*5;player.kb.y=Math.sin(v.ang)*5;cam.shake=5;if(player.scale>1.5){v.speed*=-0.5;}}
 }}
function updateVehicle(v,dt){
 if(v.thrown){const t=v.thrown;v.x+=t.vx*dt;v.y+=t.vy*dt;t.z+=t.vz*dt;t.vz-=0.45*dt;v.ang+=0.25*dt;for(const n of npcs){if(n.hiddenTransit||n.dead||n.insideB||n.vehicle)continue;if(dist(n,v)<40&&t.z<30){damageNPC(n,80,'car');n.kb.x=t.vx;n.kb.y=t.vy;}}if(t.z<=0){v.thrown=null;explodeAt(v.x,v.y,70);v.wreck=true;v.wreckT=900;v.hp=0;}return;}
 if(v.wreck){v.wreckT-=dt;if(S.frame%10===0&&v.wreckT>300)fx(v.x+rnd(-10,10),v.y+rnd(-6,6),'smoke',1);if(v.wreckT<=0){v.wreck=false;v.hp=v.hpMax;v.color=pick(CAR_COLORS);if(v.training){const p=DRIVING_COURSE.route[v.routeIndex||0];v.x=p.x;v.y=p.y;v.axis='h';v.roadX=v.roadY=null;v.ai=false;v.parked=true;v.speed=0;v.wantStop=false;return;}const axis=pick(['h','v']);v.axis=axis;v.dir=pick([1,-1]);if(axis==='h'){v.roadY=pick(HROADS);v.x=rnd(50,W-50);v.y=v.roadY+v.dir*22;}else{v.roadX=pick(VROADS);v.y=rnd(50,H-50);v.x=v.roadX-v.dir*22;}v.ai=!v.parked;}return;}
 if(v.kb.x||v.kb.y){const nx=v.x+v.kb.x*dt,ny=v.y+v.kb.y*dt;if(!solidOut(nx,ny,10)){v.x=nx;v.y=ny;}else{v.kb.x=v.kb.y=0;}v.kb.x*=0.9;v.kb.y*=0.9;if(Math.abs(v.kb.x)<0.05)v.kb.x=0;if(Math.abs(v.kb.y)<0.05)v.kb.y=0;}
 if(v.type==='tank'||v.type==='heli')return;// controlados pela história
 if(v===player.vehicle&&!player.passenger)return;
 if(!v.ai){v.speed*=0.9;return;}
 if(v.training){
  if(!v.driver){v.ai=false;v.parked=true;v.speed=0;return;}
  if(v.wantStop)v.speed=lerp(v.speed,0,0.08*dt);else v.speed=lerp(v.speed,v.type==='moto'?1.55:1.2,0.035*dt);
  if(v.speed>0.08){
   const points=DRIVING_COURSE.route,target=points[v.routeIndex%points.length],dx=target.x-v.x,dy=target.y-v.y,d=Math.hypot(dx,dy);
   if(d<12)v.routeIndex=(v.routeIndex+1)%points.length;
   else{v.ang=Math.atan2(dy,dx);const step=Math.min(d,v.speed*dt);v.x+=Math.cos(v.ang)*step;v.y+=Math.sin(v.ang)*step;}
  }
  v.x=clamp(v.x,DRIVING_COURSE.x+12,DRIVING_COURSE.x+DRIVING_COURSE.w-12);
  v.y=clamp(v.y,DRIVING_COURSE.y+12,DRIVING_COURSE.y+DRIVING_COURSE.h-12);
  return;
 }
 const signalStop=signalStopTarget(v);const blocked=vehicleAhead(v);const tgt=(blocked||v.wantStop||signalStop)?0:v.max;v.speed=lerp(v.speed,tgt,signalStop?0.12*dt:0.05*dt);
 if(blocked){v.waitT=(v.waitT||0)+dt;if(v.waitT>300){v.dir*=-1;v.lastInt=null;v.waitT=0;}}else v.waitT=0;
 if(blocked&&Math.random()<0.003&&dist(player,v)<700)SFX.car();
 if(v.axis==='h'){v.x+=v.dir*v.speed*dt;v.ang=v.dir>0?0:Math.PI;v.y=lerp(v.y,v.roadY+v.dir*22,0.1*dt);
  if(signalStop&&signalStop.axis==='h'&&(v.x-signalStop.stop)*v.dir>0){v.x=signalStop.stop;v.speed=0;}
  for(const rx of VROADS){if(Math.abs(v.x-rx)<=v.speed*dt/2+0.6&&v.lastInt!==rx){v.lastInt=rx;if(Math.random()<0.35){v.axis='v';v.roadX=rx;v.dir=pick([1,-1]);v.x=rx-v.dir*22;}break;}}}
 else{v.y+=v.dir*v.speed*dt;v.ang=v.dir>0?Math.PI/2:-Math.PI/2;v.x=lerp(v.x,v.roadX-v.dir*22,0.1*dt);
  if(signalStop&&signalStop.axis==='v'&&(v.y-signalStop.stop)*v.dir>0){v.y=signalStop.stop;v.speed=0;}
  for(const ry of HROADS){if(Math.abs(v.y-ry)<=v.speed*dt/2+0.6&&v.lastInt!==ry){v.lastInt=ry;if(Math.random()<0.35){v.axis='h';v.roadY=ry;v.dir=pick([1,-1]);v.y=ry+v.dir*22;}break;}}}
 if(v.x<-80||v.x>W+80||v.y<-80||v.y>H+80){v.dir*=-1;v.lastInt=null;}
 if(v.wantStop&&v.speed<0.3){v.ai=false;v.wantStop=false;v.parked=true;v.speed=0;if(v.axis==='h'&&v.roadY!=null)v.y=v.roadY+v.dir*48;else if(v.roadX!=null)v.x=v.roadX-v.dir*48;}
 hitPedestrians(v);
}
function explodeAt(x,y,r){fx(x,y,'boom',30);cam.shake=12;SFX.boom();S.fireAt={x,y,f:S.frame};
 for(const n of npcs)if(n.role==='fire'&&n.insideB===FIRE)npcExit(n);for(const n of npcs){if(n.hiddenTransit||n.dead||n.insideB)continue;const d=dist(n,{x,y});if(d<r){damageNPC(n,60,'fire');n.kb.x=(n.x-x)/d*6;n.kb.y=(n.y-y)/d*6;}}for(const v of vehicles){if(v.wreck||v.thrown)continue;if(dist(v,{x,y})<r&&dist(v,{x,y})>1){v.hp-=50;if(v.hp<=0&&v!==player.vehicle){v.wreck=true;v.wreckT=900;if(v.driver){npcLeaveVehicle(v.driver);}}}}witness(3);}

function fx(x,y,type,count=5,ang=0){
 for(let i=0;i<count;i++){const p={x,y,vx:rnd(-1,1),vy:rnd(-1,1),life:30,max:30,size:3,color:'#fff',type:'dot'};
  switch(type){
   case 'hit':p.vx=rnd(-3,3);p.vy=rnd(-3,1);p.color=pick(['#ffd54a','#fff','#ff9100']);p.life=p.max=18;p.size=rnd(2,4);break;
   case 'fire':p.vx=rnd(-0.8,0.8);p.vy=rnd(-2.5,-0.5);p.color=pick(['#ff3d00','#ff9100','#ffd54a','#ff6d00']);p.life=p.max=ri(18,32);p.size=rnd(3,7);p.type='glow';break;
   case 'ice':p.vx=rnd(-1.5,1.5);p.vy=rnd(-1.5,1.5);p.color=pick(['#80deea','#e0f7fa','#4dd0e1']);p.life=p.max=ri(20,40);p.size=rnd(2,5);break;
   case 'smoke':p.vx=rnd(-0.4,0.4);p.vy=rnd(-1,-0.3);p.color='rgba(90,90,90,0.5)';p.life=p.max=ri(30,60);p.size=rnd(5,10);p.type='glow';break;
   case 'wind':p.vx=Math.cos(ang+rnd(-0.4,0.4))*rnd(4,9);p.vy=Math.sin(ang+rnd(-0.4,0.4))*rnd(4,9);p.color='rgba(220,240,255,0.7)';p.life=p.max=ri(12,25);p.size=rnd(2,4);p.type='streak';break;
   case 'boom':p.vx=rnd(-5,5);p.vy=rnd(-5,5);p.color=pick(['#ff3d00','#ff9100','#ffd54a','#333','#555']);p.life=p.max=ri(20,50);p.size=rnd(4,12);p.type='glow';break;
   case 'purple':p.vx=rnd(-2,2);p.vy=rnd(-3,0);p.color=pick(['#9c27b0','#e040fb','#7b1fa2']);p.life=p.max=ri(20,40);p.size=rnd(3,6);p.type='glow';break;
   case 'heal':p.vx=rnd(-0.5,0.5);p.vy=rnd(-2,-0.5);p.color=pick(['#69f0ae','#b9f6ca']);p.life=p.max=30;p.size=4;break;
   case 'spark':p.vx=rnd(-2,2);p.vy=rnd(-2,2);p.color='#fff';p.life=p.max=10;p.size=2;break;
   case 'money':p.vx=rnd(-1,1);p.vy=rnd(-3,-1);p.color='#ffd54a';p.life=p.max=40;p.size=4;break;
  }
  parts.push(p);}
}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.type==='glow')p.vy-=0.02*dt;if(p.life<=0)parts.splice(i,1);}if(parts.length>600)parts.splice(0,parts.length-600);}
function updateProjs(dt){
 for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let hit=false;
  if(p.type==='fire'||p.type==='fireball'){if(S.frame%2===0)fx(p.x,p.y,'fire',1);}else if(p.type==='ice'){if(S.frame%3===0)fx(p.x,p.y,'ice',1);}else if(p.type==='missile'||p.type==='shell'){if(S.frame%2===0)fx(p.x,p.y,'smoke',1);}else if(p.type==='laser'){fx(p.x,p.y,'hit',1);}
  const solid=S.inside?solidIn(S.inside.interior,p.x,p.y,2):solidOut(p.x,p.y,2);
  if(solid||p.life<=0){hit=true;if(p.type==='shell'||p.type==='missile')explodeAt(p.x,p.y,60);else fx(p.x,p.y,'spark',3);}
  else if(p.owner==='player'){
   for(const n of npcs){if(n.dead||n.vehicle||n.fb)continue;if(S.inside?n.insideB!==S.inside:n.insideB)continue;const pos=npcPos(n);if(Math.hypot(pos.x-p.x,pos.y-p.y)<16){hit=true;
    if(p.type==='fire'){damageNPC(n,p.dmg,'playerFire');n.burn=120;}else if(p.type==='ice'){n.frozen=300;fx(pos.x,pos.y,'ice',10);SFX.ice();n.bubble='🥶';n.bubbleT=100;if(n.hostile)n.cool=60;}break;}}
   if(!hit&&!S.inside)for(const v of vehicles){if(v.wreck||v.thrown||v===player.vehicle)continue;if(dist(v,p)<v.w/2){hit=true;if(p.type==='fire'){v.hp-=p.dmg;if(v.hp<=0){v.wreck=true;v.wreckT=900;if(v.driver)npcLeaveVehicle(v.driver);explodeAt(v.x,v.y,60);}}break;}}
  }else{
   if(!S.inside&&!player.invis&&!player.vehicle&&Math.hypot(player.x-p.x,player.y-p.y)<16+player.scale*6){hit=true;
    if(p.owner&&p.owner.sub==='noiado'&&!S.swap){p.owner.shots=(p.owner.shots||0)+1;if(p.owner.shots>=4){p.owner.hostile=false;p.owner.scared=1200;p.owner.bubble='😱 Os tiros não fazem nada!!';p.owner.bubbleT=250;S.fame=(S.fame||0)+2;witness(2);}}
    if(p.type==='stoneG'){S.noPowersUntil=Math.max(S.noPowersUntil,absNow()+300);['fly','fast','invis','intang','xray'].forEach(k=>player[k]=false);playerHurt(16,{x:p.x,y:p.y,role:'villain'});SFX.bad();if(S.frame%50===0)notify('🟢 A onda verde drena seus poderes!','warn');}
    else if(p.type==='stoneR'){startRebel();}else if(p.type==='stoneB'){S.noPowersUntil=absNow()+300;['fly','fast','invis','intang','xray'].forEach(k=>player[k]=false);ensureFree();refreshPowerBar();notify('💎 Pedra AZUL! Seus poderes sumiram por 5 horas!','warn');SFX.bad();}
    else if(p.type==='shell'||p.type==='missile'){explodeAt(p.x,p.y,50);playerHurt(p.dmg,p.owner);}else{playerHurt(p.dmg,p.owner);fx(p.x,p.y,'hit',4);}}
   if(!hit){for(const n of npcs){if(n.dead||n.insideB||n.vehicle||n===p.owner||n.fb)continue;if(n.hostile&&!n.allyVamp&&!n.powered&&p.owner&&p.owner.hostile)continue;if(Math.hypot(n.x-p.x,n.y-p.y)<14){hit=true;damageNPC(n,p.dmg,p.type==='fireball'?'fire':'villain');if(p.type==='fireball')n.burn=90;if(p.type==='shell'||p.type==='missile')explodeAt(p.x,p.y,50);break;}}}
  }
  if(hit)projs.splice(i,1);}
}

/* ===================== VÔLEI ===================== */
function startVolley(friend){
 if(S.mini){notify('Termine o que está fazendo primeiro.');return;}
 if(S.inside!==VOLEI){notify('Você precisa estar na Quadra de Volei.');return;}
 const I=S.inside.interior;const F={x:40,y:40,w:640,h:360};/* área da quadra (sem paredes) */
 const pd2=n=>Math.hypot(n.ix-player.x,n.iy-player.y);// distância em coordenadas do INTERIOR
 const cands=npcs.filter(n=>!n.dead&&!n.hostile&&!n.fb&&!n.am&&n.insideB===VOLEI&&n.ix!=null&&pd2(n)<420).sort((a,b)=>pd2(a)-pd2(b));
 if(friend&&!cands.includes(friend))cands.unshift(friend);
 if(cands.length<2){notify('Não há gente suficiente na quadra para jogar vôlei. Chame mais gente!');return;}
 const players=cands.slice(0,6);
 players.forEach((n,i)=>{const team=i%2;n.fb={x:team?rnd(440,600):rnd(120,280),y:F.y+60+Math.floor(i/2)*110,team,hx:0,hy:0,cool:0};n.fb.hx=n.fb.x;n.fb.hy=n.fb.y;n.savedState=n.state;});
 S.mini={type:'volei',lock:false,field:F,ball:{x:F.x+F.w/2,y:F.y+F.h/2,vx:0,vy:0},score:[0,0],players,goals:[{x:F.x-12,y:F.y+F.h/2-35,w:14,h:70},{x:F.x+F.w-2,y:F.y+F.h/2-35,w:14,h:70}],target:3,kick:false,t:0};
 player.x=F.x+140;player.y=F.y+F.h/2;player.fly=false;
 notify('🏐 Partida de vôlei começou! Primeiro a '+S.mini.target+' vence. Você é do time AZUL (esquerda).','gold');SFX.goal();
}
function endVolley(){const m=S.mini;if(!m||m.type!=='volei')return;
 for(const n of m.players){if(n.fb){n.fb=null;n.state=n.savedState;}n.fb=null;}
 const won=m.score[0]>m.score[1];if(won){notify('Fim de jogo! Seu time venceu '+m.score[0]+' x '+m.score[1]+'! +R$20','gold');player.money+=20;player.stats.forca+=0.4;}else notify('Fim de jogo: '+m.score[0]+' x '+m.score[1]+'.');
 S.mini=null;player.anim=null;}
function volleyTick(dt){const m=S.mini;if(!m||m.type!=='volei')return;
 const b=m.ball,F=m.field;const pd=Math.hypot(player.x-b.x,player.y-b.y);
 if(pd<player.r*player.scale+9){const a=player.moving?player.ang:Math.atan2(b.y-player.y,b.x-player.x);const pw=m.kick?12:5;b.vx=Math.cos(a)*pw;b.vy=Math.sin(a)*pw;m.kick=false;SFX.kick();}
 const nearest=[null,null],nd=[1e9,1e9];
 for(const n of m.players){const d=Math.hypot(n.fb.x-b.x,n.fb.y-b.y);if(d<nd[n.fb.team]){nd[n.fb.team]=d;nearest[n.fb.team]=n;}}
 for(const n of m.players){const o=n.fb;o.cool-=dt;const sp=2.3;
  // o mais próximo da bola NO PRÓPRIO LADO da rede corre até ela; os demais voltam à posição
  const d=Math.hypot(o.x-b.x,o.y-b.y),net=F.x+F.w/2,mySide=o.team===0?b.x<net:b.x>=net,chase=nearest[o.team]===n&&mySide;
  const tx=chase?b.x:o.hx,ty=chase?b.y:o.hy;const a=Math.atan2(ty-o.y,tx-o.x);const dd=Math.hypot(tx-o.x,ty-o.y);if(dd>4){o.x+=Math.cos(a)*Math.min(sp*dt,dd);o.y+=Math.sin(a)*Math.min(sp*dt,dd);n.ang=a;n.walk+=dt*0.3;n.moving=true;}else n.moving=false;o.x=clamp(o.x,F.x+5,F.x+F.w-5);o.y=clamp(o.y,F.y+5,F.y+F.h-5);
  if(d<14&&o.cool<=0){const g=m.goals[o.team===0?1:0];const ga=Math.atan2(g.y+g.h/2-b.y,g.x+g.w/2-b.x)+rnd(-0.25,0.25);b.vx=Math.cos(ga)*7;b.vy=Math.sin(ga)*7;o.cool=50;if(dist(player,o)<400)SFX.kick();}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(0.965,dt);b.vy*=Math.pow(0.965,dt);
 // regra do vôlei: se a bola "cai" (para) num lado da quadra, o time adversário marca o ponto
 if(Math.hypot(b.vx,b.vy)>1)m.live=true;
 else if(m.live&&Math.hypot(b.vx,b.vy)<0.35){m.live=false;goalVolley(b.x<F.x+F.w/2?1:0);return;}
 if(b.y<F.y){b.y=F.y;b.vy*=-0.85;}if(b.y>F.y+F.h){b.y=F.y+F.h;b.vy*=-0.85;}
 const gl=m.goals[0],gr=m.goals[1];
 if(b.x<F.x){if(b.y>gl.y&&b.y<gl.y+gl.h)goalVolley(1);else{b.x=F.x;b.vx*=-0.8;}}
 if(b.x>F.x+F.w){if(b.y>gr.y&&b.y<gr.y+gr.h)goalVolley(0);else{b.x=F.x+F.w;b.vx*=-0.8;}}
}
function goalVolley(team){const m=S.mini;m.score[team]++;if(team===0)dmProg('goal',1);SFX.goal();notify((team===0?'PONTO do seu time! ':'Ponto do time vermelho! ')+m.score[0]+' x '+m.score[1],team===0?'good':'warn');const F=m.field;m.ball.x=F.x+F.w/2;m.ball.y=F.y+F.h/2;m.ball.vx=m.ball.vy=0;for(const n of m.players){n.fb.x=n.fb.hx;n.fb.y=n.fb.hy;}player.x=F.x+140;player.y=F.y+F.h/2;if(m.score[team]>=m.target)setTimeout(endVolley,400);}

function emotionTick(){
 for(const n of npcs){
  if(n.dead||n.remove||n.insideB||n.vehicle)continue;
  if(n.emotionT>0){n.emotionT-=300;if(n.emotionT<=0)n.emotion=null;}
  // namoro espontâneo
  if(Math.random()<0.01&&!n.partner&&!n.fb&&!n.important&&n.role!=='lex'&&n.role!=='lionel'){
   const o=nearestNPC(n,90,m=>m!==n&&!m.dead&&!m.partner&&!m.insideB&&!m.vehicle&&!m.hostile&&m.role!=='lex'&&m.role!=='lionel'&&!m.fb);
   if(o&&!o.important)startNPCLove(n,o);
  }
  // término aleatório
  if(n.partner&&!n.partner.dead&&!n.partner.insideB&&Math.random()<0.0008){endNPCLove(n,n.partner);}
  // paz
  if(n.state==='fight'&&n.foe&&n.foe.state==='fight'&&Math.random()<0.01)makePeace(n,n.foe);
  // briga aleatória
  if(!n.partner&&!n.hostile&&!n.fb&&Math.random()<0.0006){
   const o=nearestNPC(n,80,m=>m!==n&&!m.dead&&!m.partner&&!m.insideB&&!m.vehicle&&!m.hostile&&!m.important&&!m.fb);
   if(o)startNPCFight(n,o);
  }

 }

 const car=makeVehicle('car',start.x,start.y,'h',1);
 car.ai=false;car.parked=false;car.speed=0;car.color='#d4af37';car.lexCrashCar=true;
 const lex=npcs.find(n=>n.role==='lex'&&!n.dead&&!n.remove);

 S.flags.lexCrash.carId=car.id;

function lexCrashTick(dt){
 const crash=S.flags.lexCrash;
 if(!crash||crash.phase!=='approach')return;
 const lex=npcs.find(n=>n.role==='lex'&&!n.dead&&!n.remove);
 if(!lex)return;
 let car=vehicles.find(v=>v.id===crash.carId);
 if(!car){
  car=makeVehicle('car',crash.origin.x,crash.origin.y,'h',1);
  car.ai=false;car.parked=false;car.color='#d4af37';car.lexCrashCar=true;
  crash.carId=car.id;
 }
 const dx=crash.target.x-car.x,dy=crash.target.y-car.y,d=Math.hypot(dx,dy);
 car.ang=Math.atan2(dy,dx);
 const step=Math.min(d,3.4*dt);
 car.x+=Math.cos(car.ang)*step;car.y+=Math.sin(car.ang)*step;car.speed=3.4;
 if(d>24&&crash.t<240){crash.t+=dt;return;}
 crash.phase='rescue';car.speed=0;car.ai=false;car.parked=true;car.wreck=true;car.wreckT=1800;car.hp=0;
 car.driver=null;car.lexCrashCar=false;lex.vehicle=null;lex.x=car.x+26;lex.y=car.y+16;lex.stun=0;
 lex.state='idle';lex.bubble='😵';lex.bubbleT=220;
 fx(car.x,car.y,'smoke',16);fx(car.x,car.y,'spark',12);cam.shake=7;SFX.car();
 S.quest='Tire Lex do carro batido — chegue perto e aperte E.';
 notify('💥 O carro de Lex bateu perto de você! Ele está atordoado e precisa de ajuda.','warn');
}

function castPresidentialNPCVote(n,candidateId){
 const poll=S.flags.presidentialPoll;
 if(!poll||poll.phase!=='open'||!n)return false;
 ensurePresidentialTally(poll);
 if(!poll.processed)poll.processed={};
 if(!poll.ballots)poll.ballots={};
 if(poll.tally[candidateId]==null)return false;
 if(!poll.processed[n.id]){poll.processed[n.id]=true;poll.voterCount++;}
 const previous=poll.ballots[n.id];
 if(previous===candidateId)return false;
 if(previous)poll.tally[previous]--;
 poll.ballots[n.id]=candidateId;n.presidentialVoted=true;poll.tally[candidateId]++;
 return true;
}
function presidentialNPCChoice(n){

 const L=S.flags;

 const score=((n.id*9301+S.flags.electDay*49297+104729)%10000)/100;
 if(score<lexShare)return 'lex';
 const rest=score-lexShare,available=100-lexShare;
 if(rest<available*0.25)return 'lula';
 if(rest<available*0.50)return 'jair';
 if(rest<available*0.75)return 'flavio';
 return 'tadinho';
}

function dropTrash(n){
 if(trash.length>60||S.inside||!n)return;

function collectTrash(x,y,r,who){let c=0;for(let i=trash.length-1;i>=0;i--)if(Math.hypot(trash[i].x-x,trash[i].y-y)<r){trash.splice(i,1);c++;}
 if(c&&who==='player'){player.money+=c*3;S.fame+=c*0.4;dmProg('trash',c);SFX.ok();fx(x,y,'heal',6);notify('♻ Você recolheu '+c+' lixo'+(c>1?'s':'')+'! +R$'+(c*3)+' — o bairro agradece.','good');}
 return c;}

  else if(TRUCK&&TRUCK.driver&&TRUCK.driver!==n){if(dist(n,TRUCK)>50)moveTo(n,TRUCK,n.speed*1.2,dt);else{n.vehicle=TRUCK;n.x=TRUCK.x;n.y=TRUCK.y;}}

 if(!n.route||n.ri>=n.route.length){n.route=[];for(let i=0;i<7;i++)n.route.push(randomSpot());n.ri=0;}

}

function rollDailyMission(force){
 if(S.dm&&!S.dm.done&&!force)return;
 const day=S.day;
 let pool=DAILY.filter(m=>!m.special||(m.id==='secret'&&day>=4)||(m.id==='monster'&&day>=8));
 if(day%2===0)pool=pool.concat(DAILY.filter(m=>m.id==='lex'||m.id==='lionel'||m.id==='luxo'));// dias de Luthor
 if(day%3===0)pool=pool.concat(DAILY.filter(m=>m.id==='secret'));
 const m=Math.random()<0.4?pick(SITE_MISSIONS):pick(pool);
 S.dm={id:m.id,kind:m.kind||'site',siteId:m.kind?null:m.id,goal:m.goal||1,prog:0,
  txt:m.txt||'📍 Visite '+m.label,pay:m.pay||120,by:m.by||'Moradores de Jardim São Paulo',
  done:false,sawPower:false,started:false};
 notify('📋 Missão do dia '+day+' — '+m.by+': '+m.txt+' (prêmio R$'+m.pay+')','gold');SFX.msg();
 if(m.id==='secret')setTimeout(startSecretRescue,2500);
 if(m.id==='monster')setTimeout(spawnLexMonster,2500);
}
function dmProg(kind,amt){const d=S.dm;if(!d||d.done||d.kind!==kind)return;d.prog+=amt||1;if(d.prog>=d.goal)dmComplete(true);}
function dmComplete(ok){const d=S.dm;if(!d||d.done)return;d.done=true;
 if(ok){player.money+=d.pay;S.fame+=2;player.stats.amizade++;SFX.money();fx(player.x,player.y-20,'money',10);
  notify('✅ Missão do dia concluída! +R$'+d.pay+' +fama','gold');}
 else{SFX.bad();notify('❌ Missão do dia falhou. Amanhã tem outra.','warn');}}
function dmTick(){
 captiveTick();
 const d=S.dm;if(!d||d.done)return;
 if(d.kind==='site'){
  const site=SITE_MISSIONS.find(m=>m.id===d.siteId);
  if(site&&((site.building&&S.inside===site.building)||(!S.inside&&site.area&&inRect(player.x,player.y,site.area)))){
   dmProg('site',1);
  }
 }
 if(d.kind==='luxo'&&S.inside===LUXO)dmProg('luxo',1);
 if(d.kind==='recicla'){const h=S.time/60;if((h>=21||h<1)&&dist(player,RECICLA)<300)dmProg('recicla',1);}
 if(d.kind==='train'&&S.mini&&S.mini.type==='train'&&S.mini.reps>=15)dmProg('train',1);
 if(d.kind==='visit'&&S.inside===HOME){for(const n of npcs)if((n.role==='family')&&n.insideB===HOME&&dist(n,player)<90){dmProg('visit',1);break;}}
 if(d.kind==='secret'){
  const foes=npcs.some(n=>n.hostile&&!n.dead&&n.tag==='secret');
  const luth=npcs.find(n=>(n.role==='lex'||n.role==='lionel')&&!n.remove&&!n.dead);
  if(d.sawPower){dmComplete(false);S.exposure+=6;notify('😱 Lex/Lionel VIRAM você usar seus poderes! Missão secreta falhou.','warn');return;}
  if(luth&&(luth.stun>0||luth.hp<luth.hpMax*0.7)&&!d.started){d.started=true;notify('🕶 Eles estão em apuros! Derrote os capangas usando SOCO (F), TAPA (T) ou 🧠 Controle Mental — nada de poderes vistosos perto deles.','warn');}
  if(d.started&&!foes)dmComplete(true);
 }
 if(d.kind==='monster'){const mo=npcs.find(n=>n.sub==='lexMonster'&&!n.dead&&!n.remove);if(mo)d.started=true;else if(d.started)dmComplete(true);}
}

function comicFoe(n){
 if(n.aggroT>0&&!player.invis&&!S.inside&&!player.fly&&dist(n,player)<400)return player;
 let best=null,bd=500;
 for(const m of npcs){if(m===n||m.dead||m.remove||m.insideB||m.vehicle)continue;
  const bad=n.comicHero?(m.hostile||(m.comicVillain&&(m.suited||m.hunt))):((m.comicHero&&m.suited)||isPoweredAlly(m));
  if(!bad)continue;const d=dist(m,n);if(d<bd){bd=d;best=m;}}
 return best;
}

 const pow=n.comicId==='ben'&&n.alien?n.alien.p:n.pow;
 const pos=t===player?player:npcPos(t);
 n.ang=Math.atan2(pos.y-n.y,pos.x-n.x);
 const hit=dmg=>{if(t===player){playerHurt(Math.min(8,dmg*0.15),n);fx(player.x,player.y-8,'hit',3);return;}damageNPC(t,dmg,n.comicHero?'ally':'villain');t.kb.x=Math.cos(n.ang)*4;t.kb.y=Math.sin(n.ang)*4;};
 if(pow==='fogo'||pow==='repulsor'||pow==='vilgax'||pow==='krypton'||pow==='cristal'||pow==='tech'||pow==='agua'){shoot(n,pos,pow==='fogo'?'fireball':pow==='agua'?'ice':'laser');fx(n.x,n.y-8,pow==='agua'?'ice':'fire',3);return;}
 if(pow==='gelo'){if(t!==player){t.frozen=180;fx(pos.x,pos.y,'ice',8);}return;}
 if(pow==='teia'||pow==='simbionte'){if(t!==player){t.stun=70;t.bubble='🕸️';t.bubbleT=60;}fx(pos.x,pos.y-8,'spark',6);hit(18);return;}
 if(pow==='estalo'&&Math.random()<0.25){fx(n.x,n.y,'purple',16);SFX.magic();for(const m of npcs)if(m!==n&&!m.dead&&dist(m,n)<160&&(m.comicHero||isPoweredAlly(m))){m.stun=80;m.hp-=12;}return;}
 if(pow==='voo'){parts.push({x:n.x,y:n.y,vx:0,vy:0,life:8,max:8,size:10,color:'rgba(120,180,255,0.35)',type:'trail'});}

 hit(pow==='gigante'||pow==='raiva'||pow==='forca'?46:pow==='eco'?12:24);

 if(dist(player,n)<500)SFX.punch();
}

   Object.assign(player.stats,v.player.stats||{});

   ensureFree();cam.x=player.x;cam.y=player.y;
   refreshPowerBar();
   notify('📂 Jogo carregado: Dia '+S.day+' às '+timeStr()+'. Bem-vindo de volta, Álvaro!','gold');SFX.ok();
  }catch(e){notify('O save está corrompido.','warn');}
 });

function autoPlayerAI(n,dt){
 const m=S.auto;if(!m){n.am=null;return;}
 const o=n.am,b=m.ball,F=m.field;
 o.cool-=dt;
 // quem está mais perto da bola no seu lado corre nela; os outros voltam à posição
 let nearest=null,nd=1e9;
 for(const p of m.players){if(p.dead||!p.am)continue;const d=Math.hypot(p.x-b.x,p.y-b.y);if(p.am.team===o.team&&d<nd){nd=d;nearest=p;}}
 const chase=nearest===n;
 const tx=chase?b.x:o.hx,ty=chase?b.y:o.hy;
 const d=Math.hypot(tx-n.x,ty-n.y);
 if(d>6){const a=Math.atan2(ty-n.y,tx-n.x),sp=Math.min((chase?2.5:1.7)*dt,d);n.x+=Math.cos(a)*sp;n.y+=Math.sin(a)*sp;n.ang=a;n.moving=true;n.walk+=dt*0.3;}
 else n.moving=false;
 n.x=clamp(n.x,F.x+6,F.x+F.w-6);n.y=clamp(n.y,F.y+6,F.y+F.h-6);
 // chute/toque
 if(Math.hypot(n.x-b.x,n.y-b.y)<16&&o.cool<=0){
  o.cool=ri(30,60);
  const gx=o.team===0?F.x+F.w:F.x,gy=F.y+F.h/2+rnd(-40,40);
  const a=Math.atan2(gy-b.y,gx-b.x)+rnd(-0.4,0.4),pw=m.kind==='volei'?6:7;
  b.vx=Math.cos(a)*pw;b.vy=Math.sin(a)*pw-(m.kind==='volei'?2.4:0);
  if(dist(player,n)<420)SFX.kick();
  if(Math.random()<0.1){n.bubble=pick(['Passa!','Tá comigo!','Vai!','🔥']);n.bubbleT=60;}
 }
}
function autoMatchTick(dt){
 const m=S.auto;if(!m)return;
 m.t-=dt;
 const b=m.ball,F=m.field;
 b.x+=b.vx*dt;b.y+=b.vy*dt;
 if(m.kind==='volei'){b.vy+=0.12*dt;b.vx*=Math.pow(0.975,dt);b.vy*=Math.pow(0.97,dt);}
 else{b.vx*=Math.pow(0.975,dt);b.vy*=Math.pow(0.975,dt);}
 // jogador pode interferir na bola
 if(!S.inside&&Math.hypot(player.x-b.x,player.y-b.y)<player.r*player.scale+10){
  const a=player.moving?player.ang:Math.atan2(b.y-player.y,b.x-player.x);
  b.vx=Math.cos(a)*8;b.vy=Math.sin(a)*8;SFX.kick();
 }
 if(b.y<F.y){b.y=F.y;b.vy*=-0.8;}if(b.y>F.y+F.h){b.y=F.y+F.h;b.vy*=-0.8;}
 const gh=70,gy=F.y+F.h/2;
 if(b.x<F.x){if(Math.abs(b.y-gy)<gh/2){m.score[1]++;autoGoal(m);}else{b.x=F.x;b.vx*=-0.85;}}
 if(b.x>F.x+F.w){if(Math.abs(b.y-gy)<gh/2){m.score[0]++;autoGoal(m);}else{b.x=F.x+F.w;b.vx*=-0.85;}}
 if(m.t<=0||m.score[0]>=m.target||m.score[1]>=m.target)autoMatchEnd();
}

function needsTick(n,dt){
 if(n.hunger==null){n.hunger=rnd(0,40);n.fun=rnd(0,40);n.tired=rnd(0,30);n.social=rnd(0,40);}
 const k=dt/60;
 n.hunger=Math.min(100,n.hunger+k*0.7);
 n.fun=Math.min(100,n.fun+k*0.5);
 n.tired=Math.min(100,n.tired+k*0.45);
 n.social=Math.min(100,n.social+k*0.4);
 if(n.insideB){
  const b=n.insideB;
  if(b===MC||b===LANCH||b===ASSAI||b===MARKET||b===BAR)n.hunger=Math.max(0,n.hunger-k*22);
  if(b===LAN||b===SHOPPING||b===ZOO||b===BAR)n.fun=Math.max(0,n.fun-k*18);
  if(b===n.home)n.tired=Math.max(0,n.tired-k*26);

 if(n.state==='talk')n.social=Math.max(0,n.social-k*26);
}

 }

 const [top,val]=needs[0];

 if(top==='fun'&&h>=10&&h<23){

 if(top==='tired'&&n.home){n.target={x:n.home.door.x,y:n.home.door.y+18,b:n.home};n.state='walk';n.t=1800;
  if(Math.random()<0.25){n.bubble=pick(['😴 Tô cansado','Vou pra casa','Dia puxado...']);n.bubbleT=110;}return true;}
 if(top==='social'){

function tilePattern(base,dots,n){
 const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');

 const side=base==='#cfc9b8',road=base==='#3d3d3d';

  g.strokeStyle='rgba(80,70,55,0.12)';g.lineWidth=1;
  for(let p=0;p<=96;p+=32){g.beginPath();g.moveTo(p,0);g.lineTo(p,96);g.moveTo(0,p);g.lineTo(96,p);g.stroke();}
 }
 for(let i=0;i<n;i++){
  const hx=Math.sin((i+1)*127.1)*43758.5453,hy=Math.sin((i+1)*269.5)*24634.6345;
  const x=(hx-Math.floor(hx))*96,y=(hy-Math.floor(hy))*96;
  g.fillStyle=dots[i%dots.length];g.globalAlpha=road?0.12+(i%5)*0.035:side?0.10+(i%4)*0.025:0.13+(i%5)*0.04;
  if(!road&&!side){
   g.strokeStyle=dots[i%dots.length];g.lineWidth=.7+(i%3)*.25;
   g.beginPath();g.moveTo(x,y);g.lineTo(x+1.5+(i%4),y-2-(i%3));g.stroke();
  }else{
   g.beginPath();g.ellipse(x,y,road?1+(i%3)*.55:1+(i%2)*.35,road?0.7+(i%2)*.35:0.7,0,0,Math.PI*2);g.fill();
  }
 }
 g.globalAlpha=1;return ctx.createPattern(c,'repeat');
}
